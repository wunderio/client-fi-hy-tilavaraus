---
# drupal chart values: feature branches -> "feature" on the UpCloud dev cluster.
# Image maps as in k8s/feature/values/drupal.yaml of wunderio/drupal-project (6e220badb0a3); every other value is the site's.
# Ported from silta/silta.yml (CircleCI, GKE). Rewrites applied by silta-migrate:
# - images: CI builds into registry.wdr.io with a placeholder tag (its first push sets it); FROM-only Dockerfiles pinned by digest (php.image, nginx.image, shell.image)
# - removed: the platform's per-cluster tenant-base values set them (mounts.public-files.storageClassName, mounts.private-files.storageClassName)
# - enabled with existingSecret master-basicauth (`secrets` wrote the htpasswd file there); credentials removed from the values (nginx.basicauth)
# - values from the secrets file: secretKeyRef to Secret client-fi-hy-tilavaraus-secrets (php.env.OPTIME_API_KEY, php.env.OPTIME_URL, php.env.WARDEN_TOKEN)
# - the chart generates the passwords (no existingSecret): the platform keeps PR environments' generated Secret pr-<N>-<service> after the first sync (mariadb)
# - off for the migration: a new environment's empty database would get the reference data before `data` copies the site's (drupal >=1.44.0 imports it only into an empty database, so it can go back on after the cutover) (referenceData.enabled)

php:
  image:
    repository: registry.wdr.io/client-fi-hy-tilavaraus/php
    tag: feature-HYTV-233-remove-circleci-20261126T173816-6dce2db
  drupalCoreVersion: "11"
  cron:
    drupal:
      schedule: ~ 0 31 2 *
  php_ini:
    extraConfig: |
      ; php2shell CVE-2026-109618 / CVE-2026-109619 mitigation. Remove once PHP is patched.
      [Session]
      session.upload_progress.enabled = Off
  env:
    OPTIME_API_KEY:
      valueFrom:
        secretKeyRef:
          name: client-fi-hy-tilavaraus-secrets
          key: OPTIME_API_KEY
    OPTIME_URL:
      valueFrom:
        secretKeyRef:
          name: client-fi-hy-tilavaraus-secrets
          key: OPTIME_URL
    WARDEN_TOKEN:
      valueFrom:
        secretKeyRef:
          name: client-fi-hy-tilavaraus-secrets
          key: WARDEN_TOKEN
nginx:
  image:
    repository: registry.wdr.io/client-fi-hy-tilavaraus/nginx
    tag: feature-HYTV-233-remove-circleci-20261126T173814-6dce2db
  basicauth:
    enabled: true
    existingSecret: master-basicauth
shell:
  image:
    repository: registry.wdr.io/client-fi-hy-tilavaraus/shell
    tag: feature-HYTV-233-remove-circleci-20261126T173814-6dce2db
projectName: Tilavaraus
referenceData:
  referenceEnvironment: master
  updateAfterDeployment: false
  enabled: false
mailpit:
  enabled: true
mariadb:
  master:
    persistence:
      size: 5Gi
    resources:
      requests:
        cpu: 25m
        memory: 366Mi
      limits:
        memory: 488Mi
    config: |-
      [mysqld]
      skip-name-resolve
      explicit_defaults_for_timestamp
      basedir=/opt/bitnami/mariadb
      plugin_dir=/opt/bitnami/mariadb/plugin
      port=3306
      socket=/opt/bitnami/mariadb/tmp/mysql.sock
      tmpdir=/opt/bitnami/mariadb/tmp
      max_allowed_packet=256M
      bind-address=0.0.0.0
      pid-file=/opt/bitnami/mariadb/tmp/mysqld.pid
      log-error=/opt/bitnami/mariadb/logs/mysqld.log
      character-set-server=UTF8
      collation-server=utf8_unicode_ci
      transaction-isolation=READ-COMMITTED
      # Default max_connections value is 150.
      # Each active connection consumes approx. 19-20MB of memory.
      # Consider adding additional memory for production requests/limits when scaling up.
      max_connections=200
      # Set innodb_buffer_pool_size to 70/80% of resources.requests.memory (366Mi).
      innodb_buffer_pool_size=275Mi
      innodb_log_buffer_size=8M
      # Set innodb_log_file_size to 12.5% of innodb_buffer_pool_size (34Mi is 12.5% of 275Mi).
      innodb_log_file_size=34Mi
      innodb_lock_wait_timeout=120
      innodb_open_files=49152
      innodb_flush_log_at_trx_commit=2
      innodb_flush_method=O_DIRECT
      table_open_cache=4000
      table_definition_cache=1000
      back_log=2048
      tmp_table_size=64M
      max_heap_table_size=32M
      join_buffer_size=2M
      # have_query_cache=NO
      performance_schema=1
      innodb_write_io_threads=16
      innodb_use_native_aio=0
      # Undo Log Truncation
      innodb_undo_log_truncate=ON
      innodb_max_undo_log_size=1G
      [client]
      port=3306
      socket=/opt/bitnami/mariadb/tmp/mysql.sock
      default-character-set=UTF8
      plugin_dir=/opt/bitnami/mariadb/plugin
      [manager]
      port=3306
      socket=/opt/bitnami/mariadb/tmp/mysql.sock
      pid-file=/opt/bitnami/mariadb/tmp/mysqld.pid
mounts:
  public-files:
    enabled: true
    storage: 10G
    mountPath: /app/web/sites/default/files
  private-files:
    enabled: true
    storage: 1G
    mountPath: /app/private
varnish:
  enabled: true
