version: 2.1

orbs:
  # Include the Silta orb.
  # @see https://circleci.com/developer/orbs/orb/silta/silta
  silta: silta/silta@1

executors:
  silta:
    docker:
      - image: wunderio/silta-cicd:circleci-php8.4-node24-composer2-v1

# Define shared branch filters as reusable anchors.
branch-filters:
  ignored-branches: &ignored-branches
    branches:
      ignore:
        - production
        - master
        - /dependabot\/.*/

workflows:
  commit:
    jobs:
      - approval:
          type: approval
          name: approve-deployment
          filters:
            <<: *ignored-branches

      - silta/drupal-validate:
          name: validate
          executor: silta
          post-validation:
            - run: echo "You can add additional validation here!"

      - silta/analyze:
          name: analyze
          context: analyze
          sources: web

      # Build job for feature environments.
      # Other jobs defined below extend this job.
      - silta/drupal-build: &build
          name: build
          executor: silta
          codebase-build:
            - silta/drupal-composer-install
            - silta/npm-install-build
          context: silta_dev_upc_hy_tilavaraus
          requires:
            - validate
            - analyze
            - approve-deployment
          filters:
            <<: *ignored-branches

      # Deploy job for feature environments.
      - silta/drupal-deploy: &deploy
          name: deploy
          executor: silta
          silta_config: silta/silta.yml,silta/secrets-dev.yml
          pre-release:
            - silta/decrypt-files:
                files: silta/secrets-dev.yml
          context: silta_dev_upc_hy_tilavaraus
          requires:
            - build
          filters:
            <<: *ignored-branches

      # master and production deploy with ArgoCD (k8s/, README.md "ArgoCD
      # deployment"): no build-master/deploy-master or build-prod/deploy-prod
      # here, so the merge that hands a release over to ArgoCD does not also
      # start a Helm upgrade of it. A branch keeps CircleCI's deploy until
      # this file reaches it: production deploys from CircleCI until master
      # is merged into production.

      # This enables validation on dependabot PRs
      # Build job for dependabot environments.
      # Extends the job defined for feature environments.
      #- silta/drupal-build:
      #    <<: *build
      #    name: build-dependabot
      #    skip-deployment: true
      #    filters:
      #      branches:
      #        only: /dependabot\/.*/
