version: 2.1

orbs:
  # Include the Silta orb.
  # @see https://circleci.com/developer/orbs/orb/silta/silta
  silta: silta/silta@1

executors:
  silta:
    docker:
      - image: wunderio/silta-cicd:circleci-php8.3-node22-composer2-v1

# Define shared branch filters as reusable anchors.
branch-filters:
  ignored-branches: &ignored-branches
    branches:
      ignore:
        - production
        - main
        - /dependabot\/.*/

workflows:
  commit:
    jobs:
      - approval:
          type: approval
          name: approve-deployment
          filters:
            <<: *ignored-branches

      - silta/drupal-validate:
          name: validate
          executor: silta
          post-validation:
            - run: echo "You can add additional validation here!"

      - silta/analyze:
          name: analyze
          context: analyze
          sources: web

      # Build job for feature environments.
      # Other jobs defined below extend this job.
      - silta/drupal-build: &build
          name: build
          executor: silta
          codebase-build:
            - silta/drupal-composer-install
            - silta/npm-install-build
          context: silta_dev_upc_hy_tilavaraus
          requires:
            - validate
            - analyze
            - approve-deployment
          filters:
            <<: *ignored-branches

      # Deploy job for feature environments.
      - silta/drupal-deploy: &deploy
          name: deploy
          executor: silta
          silta_config: silta/silta.yml,silta/silta-dev.yml
          pre-release:
            - silta/decrypt-files:
                files: silta/secrets-dev.yml
          context: silta_dev_upc_hy_tilavaraus
          requires:
            - build
          filters:
            <<: *ignored-branches

      # Build job for main environment.
      - silta/drupal-build:
          <<: *build
          name: build-main
          requires:
            - validate
            - analyze
          filters:
            branches:
              only:
                - main

      # Deploy job for main environment.
      # Extends the job defined for feature environments.
      - silta/drupal-deploy:
          <<: *deploy
          name: deploy-main
          silta_config: silta/silta.yml,silta/silta-dev.yml
          pre-release:
            - silta/decrypt-files:
                files: silta/secrets-dev.yml
          requires:
            - build-main
          filters:
            branches:
              only:
                - main

      # Build job for production environment.
      # Extends the job defined for feature environments.
      - silta/drupal-build:
          <<: *build
          name: build-prod
          context: silta_prod_c_hy_tilavaraus
          requires:
            - validate
            - analyze
          filters:
            branches:
              only: production

      # Deploy job for production environment.
      # Extends the job defined for feature environments.
      - silta/drupal-deploy:
          <<: *deploy
          name: deploy-prod
          silta_config: silta/silta.yml,silta/silta-prod.yml
          pre-release:
            - silta/decrypt-files:
                files: silta/secrets-prod.yml
          context: silta_prod_c_hy_tilavaraus
          requires:
            - build-prod
          filters:
            branches:
              only: production

      # This enables validation on dependabot PRs
      # Build job for dependabot environments.
      # Extends the job defined for feature environments.
      #- silta/drupal-build:
      #    <<: *build
      #    name: build-dependabot
      #    skip-deployment: true
      #    filters:
      #      branches:
      #        only: /dependabot\/.*/
