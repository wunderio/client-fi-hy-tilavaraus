# Edit or remove this file as needed.
# Docs at https://github.com/drush-ops/drush/blob/master/examples/example.site.yml
#
# ArgoCD environments (README.md, "ArgoCD deployment"). The shell host is
# <release>-shell.<namespace>, reached through the cluster's SSH jump host; the
# release is the branch (master, production). ${REPOSITORY} comes from
# drush/Commands/SiltaAliasAlterCommands.php and is also the namespace.
local:
  root: ${env.DDEV_APPROOT}/${env.DDEV_DOCROOT}
  uri: https://${env.DDEV_HOSTNAME}

# Staging environment (master branch, k8s/staging/), on the dev cluster.
master:
  host: master-shell.${REPOSITORY}
  ssh:
    options: -J www-admin@ssh.dev.silta.cloud
  user: www-admin
  root: /app/web
  uri: https://master-${REPOSITORY}.dev.silta.cloud

# Production environment (production branch, k8s/production/), on the prod cluster.
prod:
  host: production-shell.${REPOSITORY}
  ssh:
    options: -J www-admin@ssh.prod.silta.cloud
  user: www-admin
  root: /app/web
  uri: https://tilavaraus.helsinki.fi
